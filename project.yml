name: Lull
options:
  bundleIdPrefix: com.lull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  Lull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lull
        excludes:
          - Resources/Info.plist
    resources:
      - path: Lull/Resources/Assets.xcassets
      - path: Lull/Resources/Fonts
    info:
      path: Lull/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Lull uses your microphone to record your brain dump. Recordings stay on your device and are never shared."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - Fraunces-Light.ttf
          - Fraunces-LightItalic.ttf
          - Fraunces-Regular.ttf
          - JetBrainsMono-Regular.ttf
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.lull.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: Lull/Resources/Info.plist
    scheme:
      testTargets: []
