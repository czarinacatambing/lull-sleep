name: Lull
options:
  bundleIdPrefix: com.trylull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "35"

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0

targets:
  Lull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lull
        excludes:
          - Resources/Info.plist
    resources:
      - path: Lull/Resources/Assets.xcassets
      - path: Lull/Resources/Audio
      - path: Lull/Resources/Fonts
      - path: Lull/Resources/PrivacyInfo.xcprivacy
    info:
      path: Lull/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Lull uses your microphone to record your brain dump. Recordings stay on your device and are never shared."
        NSCameraUsageDescription: "Lull briefly checks your room lighting during wind-down. The camera is never recorded or shown on screen."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIAppFonts:
          - Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf
          - Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          - JetBrainsMono-VariableFont_wght.ttf
          - JetBrainsMono-Italic-VariableFont_wght.ttf
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        LullAnalyticsEnabled: false
        LullResearchDataEnabled: false
        CFBundleURLTypes:
          - CFBundleURLName: com.trylull.app
            CFBundleURLSchemes:
              - lull
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      INFOPLIST_FILE: Lull/Resources/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Lull/Lull.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.trylull.app
    dependencies:
      - target: LullActivities
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    scheme:
      testTargets: []

  LullActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullActivities
      - path: Lull/LiveActivity
    dependencies:
      - framework: WidgetKit.framework
        implicit: true
      - framework: ActivityKit.framework
        implicit: true
      - framework: AppIntents.framework
        implicit: true
      - framework: SwiftUI.framework
        implicit: true
    info:
      path: LullActivities/Info.plist
      properties:
        CFBundleDisplayName: LullActivities
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.activities
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: LullActivities/LullActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trylull.app
