name: Lull
options:
  bundleIdPrefix: com.trylull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "12"

targets:
  Lull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lull
        excludes:
          - Resources/Info.plist
    resources:
      - path: Lull/Resources/Assets.xcassets
      - path: Lull/Resources/Fonts
    info:
      path: Lull/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Lull uses your microphone to record your brain dump. Recordings stay on your device and are never shared."
        NSCameraUsageDescription: "Lull does not use the camera."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIAppFonts:
          - Fraunces-Light.ttf
          - Fraunces-LightItalic.ttf
          - Fraunces-Regular.ttf
          - JetBrainsMono-Regular.ttf
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      INFOPLIST_FILE: Lull/Resources/Info.plist
    entitlements:
      path: Lull/Lull.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trylull.app
    dependencies:
      - target: LullActivities
        embed: true
    scheme:
      testTargets: []

  LullActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullActivities
      - path: Lull/LiveActivity
    dependencies:
      - framework: WidgetKit.framework
        implicit: true
      - framework: ActivityKit.framework
        implicit: true
      - framework: AppIntents.framework
        implicit: true
      - framework: SwiftUI.framework
        implicit: true
    info:
      path: LullActivities/Info.plist
      properties:
        CFBundleDisplayName: LullActivities
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.activities
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: LullActivities/LullActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trylull.app
