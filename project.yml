name: TenThirty
options:
  bundleIdPrefix: com.trylull
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "2.0.6"
  CURRENT_PROJECT_VERSION: "4"
  LULL_ANALYTICS_ENABLED: "NO"
  LULL_ANALYTICS_COHORT: ""
  LULL_RESEARCH_DATA_ENABLED: "NO"
  LULL_POSTHOG_API_KEY: ""
  LULL_POSTHOG_HOST: "https://us.i.posthog.com"
  LULL_RESEARCH_DATA_ENDPOINT: ""
  LULL_RESEARCH_DATA_TOKEN: ""

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.59.3

targets:
  Lull:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lull
        excludes:
          - Resources/Info.plist
    resources:
      - path: Lull/Resources/Assets.xcassets
      - path: Lull/Resources/Audio
      - path: Lull/Resources/Fonts
      - path: Lull/Resources/PrivacyInfo.xcprivacy
    info:
      path: Lull/Resources/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        CFBundleDisplayName: TenThirty
        NSMicrophoneUsageDescription: "TenThirty uses your microphone to record your brain dump. Recordings stay on your device and are never shared."
        NSCameraUsageDescription: "TenThirty briefly checks your room lighting during wind-down. The camera is never recorded or shown on screen."
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIAppFonts:
          - Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf
          - Fraunces-Italic-VariableFont_SOFT,WONK,opsz,wght.ttf
          - JetBrainsMono-VariableFont_wght.ttf
          - JetBrainsMono-Italic-VariableFont_wght.ttf
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        LullAnalyticsEnabled: "$(LULL_ANALYTICS_ENABLED)"
        LullAnalyticsCohort: "$(LULL_ANALYTICS_COHORT)"
        LullPostHogAPIKey: "$(LULL_POSTHOG_API_KEY)"
        LullPostHogHost: "$(LULL_POSTHOG_HOST)"
        LullResearchDataEnabled: "$(LULL_RESEARCH_DATA_ENABLED)"
        LullResearchDataEndpoint: "$(LULL_RESEARCH_DATA_ENDPOINT)"
        LullResearchDataToken: "$(LULL_RESEARCH_DATA_TOKEN)"
        CFBundleURLTypes:
          - CFBundleURLName: com.tenthirty.app
            CFBundleURLSchemes:
              - tenthirty
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app
      PRODUCT_NAME: TenThirty
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      INFOPLIST_FILE: Lull/Resources/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: Lull/Lull.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups:
          - group.com.trylull.app
    dependencies:
      - target: LullActivities
        embed: true
      - target: LullShieldConfiguration
        embed: true
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - package: PostHog
        product: PostHog
    scheme:
      testTargets:
        - LullTests
        - LullUITests

  LullTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullTests
    dependencies:
      - target: Lull
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.tests
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TenThirty.app/TenThirty"
      BUNDLE_LOADER: "$(TEST_HOST)"

  LullUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullUITests
    dependencies:
      - target: Lull
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.uitests
      GENERATE_INFOPLIST_FILE: YES

  LullActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullActivities
      - path: Lull/LiveActivity
    dependencies:
      - framework: WidgetKit.framework
        implicit: true
      - framework: ActivityKit.framework
        implicit: true
      - framework: AppIntents.framework
        implicit: true
      - framework: SwiftUI.framework
        implicit: true
    info:
      path: LullActivities/Info.plist
      properties:
        CFBundleDisplayName: TenThirty Activities
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.activities
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: LullActivities/LullActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trylull.app

  LullShieldConfiguration:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LullShieldConfiguration
    dependencies:
      - framework: ManagedSettings.framework
        implicit: true
      - framework: ManagedSettingsUI.framework
        implicit: true
      - framework: UIKit.framework
        implicit: true
    info:
      path: LullShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: TenThirty Shield
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShieldConfigurationExtension"
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.trylull.app.shield-configuration
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: "2WLHFD257A"
      SKIP_INSTALL: YES
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: LullShieldConfiguration/LullShieldConfiguration.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.trylull.app
